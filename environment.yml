name: arasd
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - jupyter
  - jupyterlab
  - ipywidgets
  - pandas
  - matplotlib
  - pillow
  - requests
  - pyyaml
  - pip:
      # Deep Learning & Hugging Face
      - torch
      - torchvision
      - transformers
      - accelerate
      - datasets
      - evaluate
      - bitsandbytes
      - safetensors
      - sentence-transformers
      - sentencepiece
      - tokenizers
      - vllm
      # LLM APIs & Agents
      - openai
      - anthropic
      - tiktoken
      - mcp
      # Data Science & NLP
      - numpy
      - scipy
      - scikit-learn
      - faiss-cpu
      - nltk
      - rouge-score
      - opencv-python-headless
      - einops
      # Web API & Utilities
      - fastapi
      - uvicorn
      - pydantic
      - python-dotenv
      - tqdm
      - loguru
      - rich
      ##pip install torch torchvision --index-url https://download.pytorch.org/whl/cu132 first if torch is not gpu compiled